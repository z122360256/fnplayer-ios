name: Build iOS IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build (unsigned, for sideloading)
        run: |
          set -o pipefail
          xcodebuild -project FnPlayer.xcodeproj \
            -scheme FnPlayer \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO | tail -n 80
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/FnPlayer.app Payload/
          zip -qry FnPlayer-unsigned.ipa Payload
          ls -lh FnPlayer-unsigned.ipa
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FnPlayer-unsigned-ipa
          path: FnPlayer-unsigned.ipa
          retention-days: 30