name: FnPlayer
options:
  bundleIdPrefix: com.fnplayer
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    PRODUCT_NAME: FnPlayer
    PRODUCT_BUNDLE_IDENTIFIER: com.fnplayer.app
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
targets:
  FnPlayer:
    type: application
    platform: iOS
    productName: FnPlayer
    sources:
      - path: fnplayer
        excludes:
          - "Info.plist"
    info:
      path: fnplayer/Info.plist
      properties:
        CFBundleDisplayName: 飞牛弹幕
        CFBundleName: FnPlayer
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
